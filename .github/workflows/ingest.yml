name: Refresh graph snapshot
# Reconstruye data/atlas.json desde las fuentes públicas y abre un PR: cada cambio de datos se revisa
# (y pasa los tests de integridad) antes de llegar a producción.
on:
  schedule: [{ cron: "0 6 * * 1" }]   # lunes 06:00 UTC
  workflow_dispatch:
    inputs:
      only: { description: "Fuente (orphanet|ctgov|pubmed|clinvar|opentargets|reporter|pathways|hpo|orgs) o vacío para todas", required: false }
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ingest -- ${{ inputs.only && format('--only={0}', inputs.only) || '' }}
      - name: OpenAI extraction (only if the secret exists)
        if: env.OPENAI_API_KEY != ''
        run: npm run extract
      - run: npm run analyze
      - run: npm test
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: data/refresh
          commit-message: "data: refresh graph snapshot"
          title: "data: refresh graph snapshot"
          body: "Automatic weekly rebuild of `data/atlas.json` from Orphanet, HPO, Monarch, ClinVar, ClinicalTrials.gov, Open Targets, Reactome, PubMed and NIH RePORTER. Integrity tests passed."
          add-paths: data/atlas.json
